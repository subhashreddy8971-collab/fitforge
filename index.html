<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitForge">
<meta name="theme-color" content="#0A0A0F">
<link rel="manifest" href="manifest.json">

<title>FitForge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0A0F;--surface:#12121A;--card:#1A1A26;--border:#252535;
  --accent:#6C63FF;--accent-lo:#6C63FF20;--green:#00C896;--green-lo:#00C89620;
  --orange:#FF7A2F;--orange-lo:#FF7A2F20;--red:#FF4C6A;--red-lo:#FF4C6A20;
  --yellow:#FFD166;--teal:#22D3EE;--purple:#C084FC;
  --text:#F0F0FF;--text-sub:#B0B0D0;--muted:#8080A8;--dim:#50506A;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(70px + var(--safe-bot));scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#screen::-webkit-scrollbar{display:none}
/* NAV */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:var(--safe-bot);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;
  background:none;border:none;cursor:pointer;gap:3px;color:var(--dim);transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn .icon{font-size:22px;line-height:1}
.nav-btn .label{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}
.card.accent-border{border-color:rgba(108,99,255,.4)}
.card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}
.section-label{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
/* ROW */
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
/* BADGE */
.badge{padding:3px 8px;border-radius:50px;font-size:10px;font-weight:700;border:1px solid transparent;white-space:nowrap}
/* PROGRESS */
.progress-wrap{margin-bottom:8px}
.progress-label-row{display:flex;justify-content:space-between;margin-bottom:3px}
.progress-label-row span{font-size:10px;font-weight:700;color:var(--muted)}
.progress-label-row .val{color:var(--text-sub)}
.progress-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:5px;border-radius:3px;transition:width .4s ease}
/* MACRO CHIP */
.macro-chips{display:flex;gap:6px;margin-bottom:10px}
.macro-chip{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:10px;border:1px solid transparent;gap:2px}
.macro-chip .mc-label{font-size:10px;font-weight:700;letter-spacing:.5px}
.macro-chip .mc-val{font-size:18px;font-weight:900;line-height:1}
.macro-chip .mc-unit{font-size:9px;color:var(--muted)}
/* INPUTS */
input,textarea,select{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
/* BUTTONS */
.btn{border:none;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-ghost{background:none;color:var(--accent);border:none;padding:8px 0}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:9px}
.btn-danger{background:var(--red-lo);color:var(--red);border:1px solid rgba(255,76,106,.3)}
/* RING SVG */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-center{position:absolute;text-align:center}
/* CHART */
.chart-svg{overflow:visible}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:16px;width:100%;max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + var(--safe-bot))}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.hidden{display:none!important}
/* QUICK CHIPS */
.quick-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick-chip{padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--text-sub);cursor:pointer}
.quick-chip:active{background:var(--accent-lo);border-color:var(--accent)}
/* MUSCLE FREQ */
.muscle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muscle-item{display:flex;align-items:center;gap:8px}
.muscle-bar{width:4px;height:28px;border-radius:2px;flex-shrink:0}
/* SET TABLE */
.set-table{width:100%}
.set-table th{font-size:10px;color:var(--dim);font-weight:700;padding:4px 6px;text-align:center;letter-spacing:.5px}
.set-table td{padding:5px 6px;text-align:center;font-size:13px}
.set-table tr:nth-child(even) td{background:rgba(255,255,255,.02);border-radius:6px}
/* FOOD LIST */
.food-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.food-item:last-child{border-bottom:none}
/* GI TABLE */
.gi-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.gi-circle{width:42px;height:42px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
/* CHAT */
.chat-msg{display:flex;align-items:flex-end;gap:8px;margin-bottom:12px}
.chat-msg.user{flex-direction:row-reverse}
.chat-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-lo);border:1px solid rgba(108,99,255,.3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chat-bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.6;word-break:break-word}
.chat-bubble.ai{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text-sub)}
.chat-bubble.user{background:var(--accent);border-bottom-right-radius:4px;color:#fff}
.chat-bubble strong{color:var(--text);font-weight:700}
.typing-dots{display:flex;gap:4px;padding:4px 2px}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce .8s infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
/* LIVE WORKOUT */
.live-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.set-input-row{display:grid;grid-template-columns:30px 1fr 1fr 1fr 36px;gap:6px;align-items:center;margin-top:8px}
.set-input-row input{padding:8px 6px;font-size:14px;font-weight:700;text-align:center;border-radius:8px}
.set-input-row .set-num{font-size:12px;color:var(--dim);text-align:center}
.add-set-row{background:var(--accent-lo);border:1px dashed rgba(108,99,255,.4);border-radius:10px;padding:6px;margin-top:6px}
.check-btn{width:34px;height:34px;border-radius:8px;background:var(--accent);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rest-btns{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.rest-btn{padding:4px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--muted);cursor:pointer}
.rest-btn:active{background:var(--accent-lo);border-color:var(--accent);color:var(--accent)}
.rest-banner{background:var(--accent-lo);border-bottom:1px solid rgba(108,99,255,.3);padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
/* HISTORY LIST */
.history-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.history-item.expanded{border-color:rgba(108,99,255,.4)}
/* EXPORT */
.export-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.export-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer}
.export-btn:active{opacity:.7}
.privacy-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
.mono{font-family:'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-sub);line-height:1.8;background:var(--surface);padding:12px;border-radius:8px;border:1px solid var(--border);overflow-x:auto}
/* UTILS */
.mt-sm{margin-top:8px}.mt-md{margin-top:12px}.mt-lg{margin-top:16px}
.mb-sm{margin-bottom:8px}.mb-md{margin-bottom:12px}
.text-muted{color:var(--muted)}.text-dim{color:var(--dim)}.text-accent{color:var(--accent)}
.text-green{color:var(--green)}.text-orange{color:var(--orange)}.text-red{color:var(--red)}.text-yellow{color:var(--yellow)}
.fw-700{font-weight:700}.fw-900{font-weight:900}
.fs-11{font-size:11px}.fs-12{font-size:12px}.fs-13{font-size:13px}.fs-22{font-size:22px}.fs-28{font-size:28px}.fs-36{font-size:36px}
.safe-top{padding-top:calc(16px + var(--safe-top))}
.page-pad{padding:16px}
</style>
</head>

<div id="app">

<script>
'use strict';
// ══════════════════════════════════════════════════════════════
// DATA LAYER
// ══════════════════════════════════════════════════════════════
const TODAY = () => new Date().toISOString().split('T')[0];
const uid = () => Math.random().toString(36).slice(2,9);

// FOOD DATABASE
const FOODS = {
  'egg':             {cal:78,  p:6.3, c:0.6,  f:5.3, fi:0,   unit:'egg',   g:50,  aliases:['eggs','boiled egg']},

  'chicken breast':  {cal:165, p:31,  c:0,    f:3.6, fi:0,   unit:'100g',  g:100, aliases:['chicken','grilled chicken']},

  'poha':            {cal:130, p:2.8, c:26,   f:2.5, fi:1.5, unit:'100g',  g:150, aliases:[]},
  'upma':            {cal:160, p:4,   c:28,   f:4,   fi:2,   unit:'100g',  g:150, aliases:[]},
  'coffee':          {cal:2,   p:0.3, c:0,    f:0,   fi:0,   unit:'cup',   g:240, aliases:['black coffee']},
};

// Build alias index
const ALIAS_IDX = {};
Object.entries(FOODS).forEach(([k,v]) => {
  ALIAS_IDX[k] = k;
  (v.aliases||[]).forEach(a => ALIAS_IDX[a.toLowerCase()] = k);
});

function parseFood(text) {
  const t = text.toLowerCase().trim();
  const m = t.match(/^([\d.]+)\s*(kg|g|ml|l|scoop|scoops?|plate|plates?|cup|cups?|slice|slices?|pc|tbsp|tsp)?\s*(.*)/);
  let qty=1, unitStr='', food=t;
  if(m){ qty=parseFloat(m[1])||1; unitStr=m[2]||''; food=m[3].trim(); }
  let best=null, bestScore=0;
  for(const alias of Object.keys(ALIAS_IDX)){
    if(food.includes(alias)||alias.includes(food)){
      const s=alias===food?1000:alias.length;
      if(s>bestScore){bestScore=s;best=ALIAS_IDX[alias];}
    }
  }
  if(!best) return {name:text,qty,unit:'serving',cal:200,p:10,c:20,f:8,fi:2};
  const fd=FOODS[best];
  let mul=qty;
  if(unitStr==='g'||unitStr==='ml') mul=qty/fd.g;
  else if(unitStr==='kg'||unitStr==='l') mul=(qty*1000)/fd.g;
  const r1=n=>Math.round(n*mul*10)/10;
  return {name:text,qty,unit:unitStr||fd.unit,cal:Math.round(fd.cal*mul),p:r1(fd.p),c:r1(fd.c),f:r1(fd.f),fi:r1(fd.fi)};
}

  try {
    const raw = localStorage.getItem('fitforge_v1');
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

function getNutritionTotals(day) {
  if(!day) return {cal:0,p:0,c:0,f:0,fi:0};
  return day.foods.reduce((a,fd)=>({cal:a.cal+fd.cal,p:a.p+fd.p,c:a.c+fd.c,f:a.f+fd.f,fi:a.fi+fd.fi}),{cal:0,p:0,c:0,f:0,fi:0});
}

function getMuscleFreq(days=14) {
  const cutoff = new Date(Date.now()-days*86400000).toISOString().split('T')[0];
  const freq = {Chest:0,Back:0,Legs:0,Shoulders:0,Arms:0,Core:0};
  STATE.workouts.filter(w=>w.date>=cutoff).forEach(w=>
    w.exercises.forEach(e=>{ if(freq[e.muscle]!==undefined) freq[e.muscle]++; })
  );
  return freq;
}

function getStreak() {
  let streak=0;
  const today=new Date();
  for(let i=0;i<30;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    if(STATE.workouts.some(w=>w.date===ds)){streak++;}
    else if(i>0){break;}
  }
  return streak;
}

function getPR(name) {
  let pr=0;
  STATE.workouts.forEach(w=>w.exercises.filter(e=>e.name===name).forEach(e=>
    e.sets.forEach(s=>{if((s.w||0)>pr)pr=s.w||0;})
  ));
  return pr;
}

function getRecommendation() {
  const freq=getMuscleFreq();
  const lastW=STATE.workouts[STATE.workouts.length-1];
  const lastMuscles=lastW?[...new Set(lastW.exercises.map(e=>e.muscle))]:[];
  const neglected=Object.entries(freq).filter(([,v])=>v<2).map(([k])=>k).filter(m=>!lastMuscles.includes(m));
  const PLANS={
    Chest:    [{n:'Bench Press',s:4,r:'5–7'},{n:'Incline DB Press',s:3,r:'8–12'},{n:'Cable Fly',s:3,r:'12–15'},{n:'Dips',s:3,r:'8–10'}],
    Back:     [{n:'Deadlift',s:4,r:'4–6'},{n:'Weighted Pull-ups',s:3,r:'6–10'},{n:'Barbell Row',s:3,r:'8–10'},{n:'Lat Pulldown',s:3,r:'10–12'}],
    Legs:     [{n:'Back Squat',s:4,r:'5–6'},{n:'Romanian Deadlift',s:3,r:'8–10'},{n:'Leg Press',s:3,r:'10–12'},{n:'Calf Raises',s:4,r:'15–20'}],
    Shoulders:[{n:'Overhead Press',s:4,r:'6–8'},{n:'Lateral Raise',s:4,r:'12–15'},{n:'Rear Delt Fly',s:3,r:'15'},{n:'Arnold Press',s:3,r:'10–12'}],
    Arms:     [{n:'Barbell Curl',s:3,r:'8–12'},{n:'Incline DB Curl',s:3,r:'10–12'},{n:'Skull Crushers',s:3,r:'8–10'},{n:'Hammer Curl',s:3,r:'12'}],
    Core:     [{n:'Plank',s:3,r:'60s'},{n:'Hanging Leg Raise',s:3,r:'12'},{n:'Ab Wheel',s:3,r:'10'},{n:'Cable Crunch',s:3,r:'15'}],
  };
  let nextGroup='Chest', reason='Push day — classic week start';
  if(neglected.length>0){
    nextGroup=neglected[0];reason=`${nextGroup} is undertrained (<2× this week)`;
  } else if(lastMuscles.some(m=>['Chest','Shoulders'].includes(m))){
    nextGroup='Back';reason='Push yesterday → Pull today';
  } else if(lastMuscles.includes('Back')){
    nextGroup='Legs';reason='Pull yesterday → Legs today';
  } else if(lastMuscles.includes('Legs')){
    nextGroup='Chest';reason='Legs yesterday → Push today';
  }
  return {group:nextGroup,reason,plan:PLANS[nextGroup]||PLANS.Core,neglected};
}

function aiAnswer(q) {
  const lq = q.toLowerCase();
  const rec = getRecommendation();

  // PROTEIN
  if(lq.includes('protein')){
    const days=lq.includes('today')?STATE.nutrition.slice(-1):STATE.nutrition.slice(-7);
    if(!days.length) return '📊 No nutrition logged yet. Add food in the Diet tab!';
    const total=Math.round(days.reduce((a,d)=>a+getNutritionTotals(d).p,0));
    const avg=Math.round(total/days.length);
    const gap=160-avg;
    return `📊 **Protein (last ${days.length} day${days.length>1?'s':''})**\n\nTotal: ${total}g\nDaily avg: **${avg}g**\nTarget: 160g/day\nStatus: ${avg>=160?'✅ On track!':'⚠️ '+gap+'g below target'}\n\n${gap>0?`💡 Add daily:\n• ${Math.round(gap/31*100)}g chicken (+${Math.round(gap/31*100*31/100)}g)\n• 1 whey scoop (+24g)\n• 4 eggs (+25g)`:'Great job hitting protein! 🎯'}`;
  }

  // WEIGHT PLATEAU
  if(lq.includes('weight')&&(lq.includes('not')||lq.includes('plateau')||lq.includes('decreas')||lq.includes('dropping')||lq.includes('losing'))){
    const w=STATE.weight.slice(-4);
    const change=w.length>=2?(w[w.length-1].kg-w[0].kg):0;
    const stall=Math.abs(change)<0.4;
    return `⚖️ **Weight Analysis**\n\n${w.map(x=>`${x.date}: ${x.kg}kg`).join('\n')}\n\nChange: ${change>0?'+':''}${change.toFixed(1)}kg\n\n${stall?'⚠️ **Plateau detected!** Causes:\n1. Calorie tracking drift\n2. Water retention (sodium/carbs)\n3. Poor sleep → cortisol\n4. Inconsistent weigh-in time\n\n💡 Actions:\n• Cut 150kcal/day for 2 weeks\n• Add 20-min walk daily\n• Weigh same time every morning':change<0?`✅ Trending down — ~${Math.abs(change/Math.max(w.length-1,1)*7).toFixed(2)}kg/week`:'📈 Weight rising — review your deficit.'}`;
  }

  // EXERCISE PROGRESS
  const exMap={'bench':'Bench Press','squat':'Back Squat','deadlift':'Deadlift','ohp':'Overhead Press','overhead':'Overhead Press','row':'Barbell Row'};
  for(const [kw,exName] of Object.entries(exMap)){
    if(lq.includes(kw)){
      const history=STATE.workouts.flatMap(wk=>wk.exercises.filter(e=>e.name===exName).map(e=>({date:wk.date,max:Math.max(...e.sets.map(s=>s.w||0))})));
      if(!history.length) return `No ${exName} data yet. Log it in the Train tab!`;
      const pr=Math.max(...history.map(h=>h.max));
      const delta=history[history.length-1].max-history[0].max;
      return `🏋️ **${exName} Progress**\n\n${history.map(h=>`${h.date}: **${h.max}kg**`).join('\n')}\n\n🏆 PR: **${pr}kg**\nTrend: ${delta>0?`📈 +${delta}kg overall`:'→ Stable'}\n\n💡 Next: add +2.5kg when all reps done at RPE ≤ 8`;
    }
  }

  // NEGLECTED MUSCLES
  if(lq.includes('neglect')||lq.includes('muscle')||lq.includes('balance')||lq.includes('missing')){
    const freq=getMuscleFreq();
    const sorted=Object.entries(freq).sort(([,a],[,b])=>a-b);
    const lines=sorted.map(([m,v])=>`${v===0?'🔴':v<2?'🟡':'🟢'} **${m}:** ${v}× in 14 days`);
    const neg=sorted.filter(([,v])=>v<2).map(([m])=>m);
    return `💪 **Muscle Frequency (14 days)**\n\n${lines.join('\n')}\n\n${neg.length?`⚠️ Neglected: ${neg.join(', ')}`:'✅ Great muscle balance!'}`;
  }

  // CALORIES
  if(lq.includes('calor')){
    const days=STATE.nutrition.slice(-7);
    if(!days.length) return '🔥 No calorie data yet. Log food in the Diet tab!';
    const avg=Math.round(days.reduce((a,d)=>a+getNutritionTotals(d).cal,0)/days.length);
    return `🔥 **Calorie Analysis (7 days)**\n\n${days.map(d=>`${d.date}: ${Math.round(getNutritionTotals(d).cal)} kcal`).join('\n')}\n\nAvg: **${avg} kcal**/day\nTarget: 2,200 kcal\nStatus: ${avg>2200?`+${avg-2200} surplus — reduce by cutting one snack`:`${2200-avg} deficit ✅`}`;
  }

  // TOMORROW
  if(lq.includes('tomorrow')||lq.includes('next workout')||lq.includes('should i train')||lq.includes('recommend')){
    const plan=rec.plan.slice(0,4).map(e=>`• **${e.n}** — ${e.s}×${e.r}`).join('\n');
    return `📅 **Tomorrow: ${rec.group} Day**\n\n💡 ${rec.reason}\n\n${plan}${rec.neglected.length?'\n\n⚠️ Also undertrained: '+rec.neglected.join(', '):''}`;
  }

  // DELOAD
  if(lq.includes('deload')){
    const streak=getStreak();
    return `🔄 **Deload Check**\n\nCurrent streak: ${streak} days\n\n${streak>=5?'⚠️ **Deload recommended!**\n5+ consecutive sessions. Your CNS needs recovery.\n\nDeload week:\n• Keep same exercises\n• Use 40–50% of normal weight\n• Focus on form\n• Duration: 3–5 days':'✅ No deload needed yet.\n\nDeload when:\n• 5+ straight hard sessions\n• Progress stalls 2+ weeks\n• Persistent joint aches'}`;
  }

  // OVERALL PROGRESS
  if(lq.includes('progress')||lq.includes('how am i')||lq.includes('overall')){
    const streak=getStreak();
    const freq=getMuscleFreq();
    const weekVol=STATE.workouts.filter(w=>{const d=new Date(w.date);return Date.now()-d.getTime()<7*86400000}).reduce((a,w)=>a+w.vol,0);
    const wChange=STATE.weight.length>=2?STATE.weight[STATE.weight.length-1].kg-STATE.weight[0].kg:0;
    const neg=Object.entries(freq).filter(([,v])=>v<2).map(([k])=>k);
    return `📊 **Your Progress Overview**\n\n🏋️ Total sessions: ${STATE.workouts.length}\n🔥 Streak: ${streak} days\n📦 Weekly volume: ${(weekVol/1000).toFixed(1)}t\n⚖️ Weight change: ${wChange>0?'+':''}${wChange.toFixed(1)}kg\n🥩 Avg protein: ${STATE.nutrition.length?Math.round(STATE.nutrition.slice(-7).reduce((a,d)=>a+getNutritionTotals(d).p,0)/Math.min(STATE.nutrition.length,7),0)+'g/day':'No data'}\n\n${neg.length?`⚠️ Undertrained: ${neg.join(', ')}`:'✅ All muscles trained this week!'}`;
  }

  // DEFAULT
  return `🤖 **FitForge AI Coach**\n\nI can answer:\n• "How much protein this week?"\n• "Why is my weight not dropping?"\n• "Show my bench press progress"\n• "Which muscles am I neglecting?"\n• "What should I train tomorrow?"\n• "Do I need a deload week?"\n• "How am I doing overall?"\n\n📊 Data: ${STATE.workouts.length} workouts · ${STATE.nutrition.length} nutrition days · ${STATE.weight.length} weight logs`;
}

  "You are FitForge AI Coach, a sharp, encouraging strength & nutrition coach inside a fitness app. " +
  "Answer using the USER DATA below — cite their real numbers, trends and PRs. Be concise and practical " +
  "(a few short paragraphs or bullets max). Use **bold** for emphasis and emojis sparingly. Give specific, " +

async function askGemini(question){
  if(!AICFG.key) throw new Error('No API key set');
  const model = (AICFG.model||'gemini-2.5-flash').trim();
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(AICFG.key.trim())}`;
  // Conversation history (Gemini needs the first turn to be from 'user')
  const hist = STATE.aiMessages.filter(m=>m.text).slice(-8)
    .map(m=>({role: m.role==='ai'?'model':'user', parts:[{text:m.text}]}));
  while(hist.length && hist[0].role==='model') hist.shift();
  if(!hist.length) hist.push({role:'user', parts:[{text:question}]});
  const body = {
    system_instruction:{ parts:[{ text: AI_SYSTEM_PROMPT + buildAIContext() }] },
    contents: hist,
    generationConfig:{ temperature:0.7, maxOutputTokens:1200, thinkingConfig:{ thinkingBudget:0 } }
  };
  let res;
  try{
    res = await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  }catch(e){ throw new Error('Network error — check your connection'); }
  if(!res.ok){
    let msg = `HTTP ${res.status}`;
    try{ const j=await res.json(); if(j.error&&j.error.message) msg=j.error.message; }catch(e){}
    if(res.status===400 && /API key not valid/i.test(msg)) msg='API key not valid — re-check the key in AI Settings';
    if(res.status===429) msg='Rate limit reached — wait a moment or check your Gemini quota';
    if(res.status===403) msg='Access denied — make sure the Generative Language API is enabled for this key';
    throw new Error(msg);
  }
  const j = await res.json();
  const cand = j.candidates && j.candidates[0];
  if(cand && cand.finishReason==='SAFETY') throw new Error('Response blocked by Gemini safety filters');
  const txt = cand && cand.content && cand.content.parts ? cand.content.parts.map(p=>p.text||'').join('') : '';
  if(!txt.trim()) throw new Error('Empty response from Gemini');
  return txt.trim();
}

// ── Generic Gemini call (JSON / vision) — reused by food & photo features ──
async function geminiGenerate(contents, opts){
  opts=opts||{};
  if(!AICFG.key) throw new Error('No API key set');
  const model=(AICFG.model||'gemini-2.5-flash').trim();
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(AICFG.key.trim())}`;
  const gc={ temperature: opts.temperature!=null?opts.temperature:0.3,
             maxOutputTokens: opts.maxOutputTokens||600, thinkingConfig:{ thinkingBudget:0 } };
  if(opts.json){ gc.responseMimeType='application/json'; if(opts.schema) gc.responseSchema=opts.schema; }
  const body={ contents, generationConfig:gc };
  if(opts.system) body.system_instruction={ parts:[{ text:opts.system }] };
  let res;
  try{ res=await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); }
  catch(e){ throw new Error('Network error — check your connection'); }
  if(!res.ok){
    let m=`HTTP ${res.status}`;
    try{ const j=await res.json(); if(j.error&&j.error.message) m=j.error.message; }catch(e){}
    if(res.status===400 && /API key not valid/i.test(m)) m='API key not valid — check AI ⚙️ Settings';
    if(res.status===429) m='Rate limit reached — wait a moment';
    throw new Error(m);
  }
  const j=await res.json();
  const c=j.candidates&&j.candidates[0];
  const txt=c&&c.content&&c.content.parts ? c.content.parts.map(p=>p.text||'').join('') : '';
  if(!txt.trim()) throw new Error('Empty response from Gemini');
  return txt.trim();
}

// Resize image client-side before upload to keep token/latency cost low
function fileToB64Resized(file,maxDim){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      const scale=Math.min(1,(maxDim||768)/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{ const d=cv.toDataURL('image/jpeg',0.8); resolve({ b64:d.split(',')[1], mime:'image/jpeg' }); }
      catch(e){ reject(new Error('Could not process image')); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src=url;
  });
}

const FOOD_SCHEMA={ type:'ARRAY', items:{ type:'OBJECT', properties:{
  name:{type:'STRING'}, cal:{type:'NUMBER'}, p:{type:'NUMBER'}, c:{type:'NUMBER'}, f:{type:'NUMBER'}, fi:{type:'NUMBER'}
}, required:['name','cal','p','c','f','fi'] } };
async function geminiParseFoods(text){
  const sys='You are a nutrition parser. Estimate macros for the foods described. Assume typical Indian serving sizes when a quantity is not given. Return a JSON array — one element per distinct food, with realistic integer-ish values. "name" should be a short label including the quantity.';
  const out=await geminiGenerate(
    [{role:'user',parts:[{text:`Parse and estimate macros for: "${text}"`}]}],
    { json:true, schema:FOOD_SCHEMA, system:sys, maxOutputTokens:600, temperature:0.2 });
  const arr=JSON.parse(out);
  if(!Array.isArray(arr)||!arr.length) throw new Error('No foods recognised');
  return arr;
}

const EX_SCHEMA={ type:'OBJECT', properties:{
  exercise:{type:'STRING'}, muscle:{type:'STRING'}, note:{type:'STRING'}
}, required:['exercise','muscle'] };
async function geminiIdentifyExercise(b64,mime){
  const sys='You identify gym equipment, machines or free weights from a photo and name the single most likely exercise someone would log. "muscle" MUST be exactly one of: Chest, Back, Legs, Shoulders, Arms, Core. "note" = one short tip on using it (max 12 words).';
  const out=await geminiGenerate(
    [{role:'user',parts:[
      {text:'Identify this gym equipment and the common exercise name for it.'},
      {inline_data:{ mime_type:mime, data:b64 }}
    ]}],
    { json:true, schema:EX_SCHEMA, system:sys, maxOutputTokens:300, temperature:0.2 });
  return JSON.parse(out);
}
function startPhotoExercise(){
  if(!geminiActive()){ aiToast('Add your Gemini key in AI → ⚙️ to identify by photo','warn'); return; }

async function onExercisePhoto(input){

  aiToast('🔍 Identifying equipment…','ok');

function ring(value, max, size, stroke, color) {
  const r=(size-stroke)/2, circ=2*Math.PI*r;
  const pct=Math.min(value/max,1), off=circ*(1-pct), cx=size/2;
  return `<svg width="${size}" height="${size}" class="chart-svg" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
      style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}

function macroBar(label, val, max, color) {
  const pct=Math.min(val/max*100,100);
  return `<div class="progress-wrap">
    <div class="progress-label-row"><span>${label}</span><span class="val">${Math.round(val)}/${max}g</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

function badge(text, color) {
  return `<span class="badge" style="color:${color};background:${color}22;border-color:${color}44">${text}</span>`;
}

function formatAIText(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function lineChart(data, w, h, color, unit='') {
  if(!data||data.length<2) return `<p class="text-dim fs-12" style="text-align:center;padding:20px">Need more data points</p>`;
  const pad={l:38,r:10,t:12,b:24};
  const W=w-pad.l-pad.r, H=h-pad.t-pad.b;
  const ys=data.map(d=>d.y), xs=data.map(d=>d.x);
  const minY=Math.min(...ys)*0.98, maxY=Math.max(...ys)*1.02;
  const minX=Math.min(...xs), maxX=Math.max(...xs)||1;
  const sx=x=>pad.l+((x-minX)/(maxX-minX))*W;
  const sy=y=>pad.t+H-((y-minY)/(maxY-minY||1))*H;
  const pts=data.map(d=>`${sx(d.x).toFixed(1)},${sy(d.y).toFixed(1)}`).join(' ');
  const grids=[.25,.5,.75,1].map(p=>{
    const gy=minY+p*(maxY-minY), sgy=sy(gy);
    return `<line x1="${pad.l}" y1="${sgy.toFixed(1)}" x2="${w-pad.r}" y2="${sgy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${pad.l-4}" y="${(sgy+4).toFixed(1)}" fill="var(--dim)" font-size="9" text-anchor="end">${Math.round(gy)}${unit}</text>`;
  }).join('');
  const dots=data.map(d=>`<circle cx="${sx(d.x).toFixed(1)}" cy="${sy(d.y).toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const labels=data.filter((_,i)=>i===0||i===Math.floor(data.length/2)||i===data.length-1).map(d=>
    `<text x="${sx(d.x).toFixed(1)}" y="${h-4}" fill="var(--dim)" font-size="9" text-anchor="middle">${d.label||d.x}</text>`
  ).join('');
  return `<svg width="${w}" height="${h}" style="overflow:visible">
    ${grids}
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

function barChart(data, w, h, defColor) {
  if(!data||!data.length) return '';
  const pad={l:38,r:8,t:12,b:24};
  const W=w-pad.l-pad.r, H=h-pad.t-pad.b;
  const maxV=Math.max(...data.map(d=>d.v),1);
  const bw=(W/data.length)*0.6, gap=(W/data.length)*0.4;
  const grids=[.5,1].map(p=>{
    const gy=pad.t+H*(1-p);
    return `<line x1="${pad.l}" y1="${gy.toFixed(0)}" x2="${w-pad.r}" y2="${gy.toFixed(0)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${pad.l-4}" y="${(gy+4).toFixed(0)}" fill="var(--dim)" font-size="9" text-anchor="end">${Math.round(maxV*p)}</text>`;
  }).join('');
  const bars=data.map((d,i)=>{
    const bh=Math.max((d.v/maxV)*H,2);
    const bx=pad.l+i*(W/data.length)+gap/2, by=pad.t+H-bh;
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${d.color||defColor}" rx="3"/>
    <text x="${(bx+bw/2).toFixed(1)}" y="${h-4}" fill="var(--dim)" font-size="9" text-anchor="middle">${d.label}</text>`;
  }).join('');
  return `<svg width="${w}" height="${h}" style="overflow:visible">${grids}${bars}</svg>`;
}

// ACTIVE WORKOUT
let restTimer=null, restLeft=0;
function startRestTimer(sec) {
  clearInterval(restTimer);
  restLeft=sec;
  updateRestBanner();
  restTimer=setInterval(()=>{
    restLeft--;
    if(restLeft<=0){clearInterval(restTimer);restLeft=0;}
    updateRestBanner();
  },1000);
}
function updateRestBanner() {
  const el=document.getElementById('rest-banner');
  if(!el) return;
  if(restLeft<=0){el.classList.add('hidden');return;}
  el.classList.remove('hidden');
  const m=Math.floor(restLeft/60), s=String(restLeft%60).padStart(2,'0');
  document.getElementById('rest-time').textContent=`${m}:${s}`;
  document.getElementById('rest-time').style.color=restLeft<=30?'var(--green)':'var(--accent)';
}

let workoutStartTime=null;
function startWorkout() {
  workoutStartTime=Date.now();
  STATE.activeWorkout={id:uid(),date:TODAY(),exercises:[],vol:0,startedAt:new Date().toISOString()};
  save(); renderTab();
}

function addExercise(name,muscle) {
  if(!STATE.activeWorkout) return;
  STATE.activeWorkout.exercises.push({id:uid(),name,muscle,type:'compound',sets:[]});
  document.getElementById('ex-modal').classList.add('hidden');
  save(); renderActiveWorkout();
}

function addSet(exId) {
  const wEl=document.getElementById(`w-${exId}`);
  const rEl=document.getElementById(`r-${exId}`);
  const rpeEl=document.getElementById(`rpe-${exId}`);
  const w=parseFloat(wEl?.value)||0;
  const r=parseInt(rEl?.value)||0;
  const rpe=parseFloat(rpeEl?.value)||undefined;
  if(!w&&!r) return;
  const ex=STATE.activeWorkout.exercises.find(e=>e.id===exId);
  if(!ex) return;
  ex.sets.push({id:uid(),w,r,rpe,done:true});
  STATE.activeWorkout.vol=STATE.activeWorkout.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
  if(rpeEl) rpeEl.value='';
  startRestTimer(120);
  save(); renderActiveWorkout();
}

function removeSet(exId,setId) {
  const ex=STATE.activeWorkout?.exercises.find(e=>e.id===exId);
  if(ex){ex.sets=ex.sets.filter(s=>s.id!==setId);}
  save(); renderActiveWorkout();
}

function removeExercise(exId) {
  if(!STATE.activeWorkout) return;
  STATE.activeWorkout.exercises=STATE.activeWorkout.exercises.filter(e=>e.id!==exId);
  save(); renderActiveWorkout();
}

function finishWorkout() {
  if(!STATE.activeWorkout) return;
  if(!confirm(`Finish workout?\n${STATE.activeWorkout.exercises.length} exercises · ${Math.round(STATE.activeWorkout.vol||0)}kg`)) return;
  const dur=Math.round((Date.now()-(workoutStartTime||Date.now()))/60000)||1;
  const finished={...STATE.activeWorkout,duration:dur,vol:Math.round(STATE.activeWorkout.vol||0)};
  STATE.workouts.push(finished);
  STATE.activeWorkout=null;
  clearInterval(restTimer); restLeft=0;
  save(); workoutSubTab='history'; renderTab();
}

function cancelWorkout() {
  if(!confirm('Cancel workout? All data will be lost.')) return;
  STATE.activeWorkout=null;
  clearInterval(restTimer); restLeft=0;
  save(); renderTab();
}

function addFood(text) {
  const t=text||document.getElementById('food-input')?.value;
  if(!t||!t.trim()) return;
  const parsed=parseFood(t.trim());
  const today=TODAY();
  const food={id:uid(),name:t.trim(),meal:selMeal,cal:parsed.cal,p:parsed.p,c:parsed.c,f:parsed.f,fi:parsed.fi};

let progressTab='weight';
function renderProgress(){
  const CW=Math.min(window.innerWidth,430)-64;
  const w=STATE.weight;

  const wChange=lastW-firstW;
  const wData=w.map((d,i)=>({x:i,y:d.kg,label:d.date.slice(5)}));

  function exData(name){
    return STATE.workouts.flatMap((wk,i)=>wk.exercises.filter(e=>e.name===name).map(e=>({x:i,y:Math.max(...e.sets.map(s=>s.w||0)),label:wk.date.slice(5)})));
  }
  const benchD=exData('Bench Press'), squatD=exData('Back Squat'), dlD=exData('Deadlift'), ohpD=exData('Overhead Press');

  const muscleVol={};
  STATE.workouts.slice(-14).forEach(wk=>wk.exercises.forEach(e=>{muscleVol[e.muscle]=(muscleVol[e.muscle]||0)+e.sets.reduce((a,s)=>a+s.w*s.r,0);}));
  const volBars=Object.entries(muscleVol).sort(([,a],[,b])=>b-a).map(([m,v])=>({label:m.slice(0,3),v,color:({Chest:'#6C63FF',Back:'#22D3EE',Legs:'#00C896',Shoulders:'#FFD166',Arms:'#FF7A2F',Core:'#C084FC'})[m]||'var(--accent)'}));

async function sendAI(q){
  const question=q||(document.getElementById('ai-input')?.value||'').trim();
  if(!question) return;
  STATE.aiMessages.push({id:uid(),role:'user',text:question,ts:new Date().toISOString()});
  if(!q && document.getElementById('ai-input')) document.getElementById('ai-input').value='';
  renderAI();
  if(geminiActive()){
    try{
      const answer=await askGemini(question);
      STATE.aiMessages.push({id:uid(),role:'ai',text:answer,ts:new Date().toISOString()});
    }catch(e){
      const fallback=aiAnswer(question);
      STATE.aiMessages.push({id:uid(),role:'ai',
        text:`⚠️ *Gemini unavailable: ${e.message}*\n\nHere's an offline answer instead:\n\n${fallback}`,
        ts:new Date().toISOString()});
    }
    save(); renderAI();
  } else {
    setTimeout(()=>{
      const answer=aiAnswer(question);
      STATE.aiMessages.push({id:uid(),role:'ai',text:answer,ts:new Date().toISOString()});
      save(); renderAI();
    },700);
  }
}

    </div>

const _RCON=[0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1b,0x36,0x6c,0xd8,0xab,0x4d];
const _MUL2=new Uint8Array(256),_MUL3=new Uint8Array(256);
(function(){for(let a=0;a<256;a++){const x=((a<<1)^((a&0x80)?0x11b:0))&0xff;_MUL2[a]=x;_MUL3[a]=x^a;}})();
function _expandKey(key){const Nk=8,Nr=14,w=new Array(4*(Nr+1));
  for(let i=0;i<Nk;i++)w[i]=[key[4*i],key[4*i+1],key[4*i+2],key[4*i+3]];
  for(let i=Nk;i<4*(Nr+1);i++){let t=w[i-1].slice();
    if(i%Nk===0){t=[t[1],t[2],t[3],t[0]].map(b=>_SBOX[b]);t[0]^=_RCON[i/Nk-1];}
    else if(i%Nk===4){t=t.map(b=>_SBOX[b]);}
    w[i]=t.map((b,j)=>b^w[i-Nk][j]);}return w;}
function _encBlock(inp,w){const Nr=14;const s=[[],[],[],[]];
  for(let i=0;i<16;i++)s[i%4][(i/4)|0]=inp[i];
  const ark=r=>{for(let c=0;c<4;c++)for(let rr=0;rr<4;rr++)s[rr][c]^=w[r*4+c][rr];};
  ark(0);
  for(let round=1;round<Nr;round++){
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)s[r][c]=_SBOX[s[r][c]];
    for(let r=1;r<4;r++){const row=s[r].slice();for(let c=0;c<4;c++)s[r][c]=row[(c+r)%4];}
    for(let c=0;c<4;c++){const a0=s[0][c],a1=s[1][c],a2=s[2][c],a3=s[3][c];
      s[0][c]=_MUL2[a0]^_MUL3[a1]^a2^a3; s[1][c]=a0^_MUL2[a1]^_MUL3[a2]^a3;
      s[2][c]=a0^a1^_MUL2[a2]^_MUL3[a3]; s[3][c]=_MUL3[a0]^a1^a2^_MUL2[a3];}
    ark(round);}
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)s[r][c]=_SBOX[s[r][c]];
  for(let r=1;r<4;r++){const row=s[r].slice();for(let c=0;c<4;c++)s[r][c]=row[(c+r)%4];}
  ark(Nr);
  const out=new Uint8Array(16);for(let i=0;i<16;i++)out[i]=s[i%4][(i/4)|0];return out;}
function _ctrLE(data,w){const out=new Uint8Array(data.length);const ctr=new Uint8Array(16);let n=1;
  for(let off=0;off<data.length;off+=16){let v=n;for(let i=0;i<16;i++){ctr[i]=v&0xff;v=Math.floor(v/256);}
    const ks=_encBlock(ctr,w);const end=Math.min(16,data.length-off);
    for(let i=0;i<end;i++)out[off+i]=data[off+i]^ks[i];n++;}

async function _pbkdf2(pw,salt,totalBytes){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-1',salt,iterations:1000},k,totalBytes*8);
  return new Uint8Array(bits);}
async function _inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw');
  const ab=await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(ab);}
// Decrypt a WinZip-AES zip → { filename: Uint8Array }
async function unzipAES(buf,password,onStep){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  let eocd=-1; for(let i=buf.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0) throw new Error('Not a valid ZIP file');
  const cdOff=dv.getUint32(eocd+16,true), cdCount=dv.getUint16(eocd+10,true);
  let p=cdOff; const entries=[];
  for(let e=0;e<cdCount;e++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.slice(p+46,p+46+nameLen));
    let aesStrength=3, actualMethod=8, ext=p+46+nameLen, extEnd=ext+extraLen;
    while(ext<extEnd){const id=dv.getUint16(ext,true),sz=dv.getUint16(ext+2,true);
      if(id===0x9901){aesStrength=buf[ext+8];actualMethod=dv.getUint16(ext+9,true);} ext+=4+sz;}
    entries.push({name,compSize,lho,aesStrength,actualMethod});
    p+=46+nameLen+extraLen+commLen;
  }
  const out={}; let done=0;
  for(const en of entries){
    if(en.name.endsWith('/')) continue;
    if(onStep) onStep(en.name.split('/').pop(), ++done, entries.length);
    const lhNameLen=dv.getUint16(en.lho+26,true), lhExtraLen=dv.getUint16(en.lho+28,true);
    let dpos=en.lho+30+lhNameLen+lhExtraLen;
    const saltLen={1:8,2:12,3:16}[en.aesStrength]||16;
    const salt=buf.slice(dpos,dpos+saltLen); dpos+=saltLen;
    const pv=buf.slice(dpos,dpos+2); dpos+=2;
    const ctLen=en.compSize - saltLen - 2 - 10;
    const ct=buf.slice(dpos,dpos+ctLen);
    const dk=await _pbkdf2(password,salt,32+32+2);
    if(dk[64]!==pv[0]||dk[65]!==pv[1]) throw new Error('Wrong password');
    const plain=_ctrLE(ct,_expandKey(dk.slice(0,32)));
    out[en.name]= en.actualMethod===8 ? await _inflateRaw(plain) : plain;
    await new Promise(r=>setTimeout(r,0)); // yield to keep UI responsive
  }
  return out;
}

// --- CSV + Zepp parsing ---
function _csv(text){
  if(!text) return [];
  text=text.replace(/^﻿/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.length);
  if(lines.length<2) return [];
  const head=lines[0].split(',');
  return lines.slice(1).map(l=>{const c=l.split(',');const o={};head.forEach((h,i)=>o[h]=c[i]);return o;});
}
const ZEPP_SPORT={1:'Outdoor Run',6:'Walk',8:'Treadmill',9:'Cycling',10:'Indoor Cycling',12:'Elliptical',15:'Swim',16:'Free Training',23:'Rope Skip',60:'Yoga',52:'Strength',92:'Workout'};
async function importZeppZip(file,password,statusCb){
  statusCb&&statusCb('Reading file…');
  const buf=new Uint8Array(await file.arrayBuffer());
  const files=await unzipAES(buf,password,(n,i,t)=>statusCb&&statusCb(`Decrypting ${n} (${i}/${t})…`));
  statusCb&&statusCb('Parsing data…');
  const dec=new TextDecoder();
  const grab=suffix=>{const k=Object.keys(files).find(n=>n.toUpperCase().includes(suffix)); return k?dec.decode(files[k]):null;};

  const user=_csv(grab('USER/'))[0]||_csv(grab('USER'))[0];
  const activity=_csv(grab('ACTIVITY/ACTIVITY_')||grab('/ACTIVITY_')).map(r=>({date:r.date,steps:+r.steps||0,dist:+r.distance||0,cal:+r.calories||0})).filter(r=>r.date);
  const sleep=_csv(grab('SLEEP/SLEEP_')||grab('/SLEEP_')).map(r=>{const deep=+r.deepSleepTime||0,light=+r.shallowSleepTime||0,rem=+r.REMTime||0;return{date:r.date,deep,light,rem,total:deep+light+rem};}).filter(r=>r.date&&r.total>0);
  const sport=_csv(grab('SPORT/SPORT_')||grab('/SPORT_')).map(r=>({type:+r.type,name:ZEPP_SPORT[+r.type]||'Workout',date:(r.startTime||'').slice(0,10),durSec:+r['sportTime(s)']||0,distM:+r['distance(m)']||0,cal:+r['calories(kcal)']||0})).filter(r=>r.date);
  const body=_csv(grab('BODY/BODY_')||grab('/BODY_')).map(r=>({date:(r.time||'').slice(0,10),kg:+r.weight||0,bf:(r.fatRate&&r.fatRate!=='null')?+r.fatRate:undefined,bmi:(r.bmi&&r.bmi!=='null')?+r.bmi:undefined})).filter(r=>r.date&&r.kg);

  // resting HR = ~5th percentile of each day's continuous readings
  const hrText=grab('HEARTRATE_AUTO/')||grab('HEARTRATE_AUTO');
  const byDay={};
  if(hrText){
    const lines=hrText.replace(/^﻿/,'').split(/\r?\n/);
    for(let i=1;i<lines.length;i++){const c=lines[i].split(','); if(c.length<3) continue;
      const hr=+c[2]; if(hr>30&&hr<220){ (byDay[c[0]]||(byDay[c[0]]=[])).push(hr); }}
  }
  const rhr=Object.keys(byDay).sort().map(date=>{const a=byDay[date].sort((x,y)=>x-y);
    return {date,bpm:a[Math.floor(a.length*0.05)],avg:Math.round(a.reduce((s,v)=>s+v,0)/a.length)};});

  // Sort chronologically (Zepp rows aren't always in order)
  const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
  activity.sort(byDate); sleep.sort(byDate); sport.sort(byDate); body.sort(byDate);

  // Commit
  STATE.watch={ activity, sleep, sport, rhr, importedAt:new Date().toISOString(),
    profile:user?{name:user.nickName,height:+user.height||null,weight:+user.weight||null}:null };
  if(body.length){ STATE.weight=body.map(b=>({id:uid(),date:b.date,kg:Math.round(b.kg*10)/10,bf:b.bf,bmi:b.bmi})); }
  if(user){ if(user.nickName) STATE.settings.name=user.nickName; if(+user.height) STATE.settings.heightCm=+user.height; if(+user.weight) STATE.settings.weightKg=+user.weight; }
  save();
  return { days:activity.length, hrDays:rhr.length, sleepDays:sleep.length, sessions:sport.length, weights:body.length };
}

async function runWatchImport(){
  const f=document.getElementById('watch-file').files[0];
  const pw=(document.getElementById('watch-pw').value||'').trim();
  const st=m=>{const e=document.getElementById('watch-status'); if(e){e.style.color='var(--muted)';e.textContent=m;}};
  if(!f){ st('⚠️ Choose your Zepp .zip first'); return; }
  if(!pw){ st('⚠️ Enter the password from the email'); return; }
  try{
    const sum=await importZeppZip(f,pw,st);
    st('');
    const el=document.getElementById('watch-status');
    if(el){ el.style.color='var(--green)';
      el.innerHTML=`✅ Imported: ${sum.days} activity days · ${sum.hrDays} HR days · ${sum.sleepDays} sleep nights · ${sum.sessions} workouts · ${sum.weights} weigh-ins`; }
    aiToast('⌚ Watch data imported','ok');
    setTimeout(()=>{ const m=document.getElementById('watch-modal'); if(m)m.remove(); renderTab(); },1400);
  }catch(e){
    const el=document.getElementById('watch-status'); if(el){ el.style.color='var(--red)'; el.textContent='❌ '+e.message; }
  }
}

// TAB ROUTER
// ══════════════════════════════════════════════════════════════
function showTab(tab) {
  currentTab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===tab);
  });
  renderTab();
}

function renderTab() {
  const screen=document.getElementById('screen');
  if(currentTab==='home')      screen.innerHTML=renderHome();
  else if(currentTab==='workout') {if(STATE.activeWorkout)renderActiveWorkout(); else screen.innerHTML=renderWorkout();}
  else if(currentTab==='nutrition'){screen.innerHTML=renderNutritionHTML();const inp=document.getElementById('food-input');if(inp){inp.addEventListener('keydown',e=>{if(e.key==='Enter'){addFood();e.preventDefault();}});}}
  else if(currentTab==='progress') screen.innerHTML=renderProgress();
  else if(currentTab==='ai')    renderAI();
  else if(currentTab==='files') screen.innerHTML=renderFiles();
  screen.scrollTop=0;
}

// Make export function globally available
window.doExport = function(fmt) {
  const screen=document.getElementById('screen');
  const s=STATE.settings;
  function wktToMd(w){
    const muscles=[...new Set(w.exercises.map(e=>e.muscle))];
    const lines=[`# Workout — ${w.date}`,`> ${muscles.join(' · ')}`,`**Duration:** ${w.duration} min`,`**Volume:** ${w.vol?.toLocaleString()} kg`,`**Notes:** ${w.notes||'—'}`,''];
    w.exercises.forEach(ex=>{
      lines.push(`## ${ex.name}`,`> *${ex.muscle}*`,'','| Set | Weight | Reps | RPE |','|-----|--------|------|-----|');
      ex.sets.forEach((s,i)=>lines.push(`| ${i+1} | ${s.w}kg | ${s.r} | ${s.rpe||'—'} |`));
      lines.push('');
    });
    return lines.join('\n');
  }
  function nutToMd(day){
    const t=getNutritionTotals(day);
    const lines=[`# Nutrition — ${day.date}`,'','| Food | Cal | P | C | F |','|------|-----|---|---|---|',...day.foods.map(f=>`| ${f.name} | ${f.cal} | ${f.p}g | ${f.c}g | ${f.f}g |`),'',`**Total:** ${Math.round(t.cal)} kcal · P:${Math.round(t.p)}g · C:${Math.round(t.c)}g · F:${Math.round(t.f)}g`];
    return lines.join('\n');
  }
  let content='', fname='', mime='';
  if(fmt==='markdown'){
    content=[`# FitForge Export\n*${new Date().toISOString()}*`,'',...STATE.workouts.map(wktToMd),'---',...STATE.nutrition.map(nutToMd),'---','# Weight Log','','| Date | Weight |','|------|--------|',...STATE.weight.map(w=>`| ${w.date} | ${w.kg}kg |`)].join('\n\n');
    fname=`FitForge-${TODAY()}.md`; mime='text/markdown';
  } else if(fmt==='csv'){
    const rows=['date,type,exercise,set,kg,reps,rpe,calories,protein,carbs,fat'];
    STATE.workouts.forEach(w=>w.exercises.forEach(ex=>ex.sets.forEach((s,i)=>rows.push(`${w.date},workout,"${ex.name}",${i+1},${s.w},${s.r},${s.rpe||''},,,,`))));
    STATE.nutrition.forEach(d=>d.foods.forEach(f=>rows.push(`${d.date},food,"${f.name}",,,,,${f.cal},${f.p},${f.c},${f.f}`)));
    STATE.weight.forEach(w=>rows.push(`${w.date},weight,,,,,,,,,,${w.kg}`));
    content=rows.join('\n'); fname=`FitForge-${TODAY()}.csv`; mime='text/csv';
  } else {
    content=JSON.stringify({exported:new Date().toISOString(),settings:STATE.settings,workouts:STATE.workouts,nutrition:STATE.nutrition,weight:STATE.weight},null,2);
    fname=`FitForge-${TODAY()}.json`; mime='application/json';
  }
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
};

// SERVICE WORKER
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

renderTab();
